<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A guide for every key in the keyboard" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="" type="image/x-icon" />
    <title>My Awesome Website</title>
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <div class="left-side">
          <img src="img/warning.svg" alt="copyright logo" class="warn" />
          <p>This site is owned by Ehron</p>
        </div>
        <p>Press `SPACE` to toggle back to home</p>
      </nav>
    </header>
    <main>
      <div class="info-container">
        <a
          class="info-text"
          href="https://www.toptal.com/developers/keycode/table"
          target="_blank"
          >Press any key to get JavaScript event Keycode info</a
        >
      </div>
      <div id="key-select">
        <p id="key"></p>
        <div class="key-info-container">
          <div class="key-card">
            <p class="key-info-title"></p>
            <p class="key-pressed"></p>
            <p class="key-info-description"></p>
          </div>
          <div class="key-card">
            <p class="key-info-title"></p>
            <p class="key-pressed"></p>
            <p class="key-info-description"></p>
          </div>
          <div class="key-card">
            <p class="key-info-title"></p>
            <p class="key-pressed"></p>
            <p class="key-info-description"></p>
          </div>
        </div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
